name: Generate Daily Newsletter

on:
  schedule:
    # Chạy 6:30 sáng mỗi ngày giờ Việt Nam (UTC+7) = 23:30 UTC hôm trước
    - cron: '30 23 * * *'
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Generate newsletter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate.py

      - name: Deploy to GitHub Pages
        run: |
          git config user.name "MA Intelligence Bot"
          git config user.email "bot@ma-intelligence.local"
          git add docs/
          git diff --staged --quiet || git commit -m "Newsletter $(date +'%Y-%m-%d %H:%M ICT')"
          git push
